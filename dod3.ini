# Drakengard 3 Recompiled -- settings. One KEY = VALUE per line; lines
# starting with # are comments. The same names work as environment
# variables, and a variable set in the environment overrides this file.
# The file is read from the folder that holds the game (dod3.exe on
# Windows; on macOS the app's data folder, Library/Application Support/
# Drakengard 3 Recompiled), else from the current folder.
#
# The game's own Settings menu has a Graphics Settings, a System Settings
# and an Advanced Graphics page that edit this file; the Settings page
# applies what can change while the game runs and says which rows take
# effect at the next start.

# Internal rendering resolution, as a multiple of the game's own 1280x720:
#   1 = 1280x720 (original)   1.5 = 1920x1080   2 = 2560x1440   3 = 3840x2160
# Anything from 0.5 to 8 works. Cost on an RTX 4090: 3 is a few fps; on an
# M1 Pro, 1.5 holds 60 fps in battle.
RSX_SCALE = 1

# Display mode: windowed (a bordered window of RSX_WINDOW size), borderless
# (a window covering the display; the mode to use), or fullscreen
# (exclusive, at the display's current resolution).
RSX_DISPLAY = windowed

# Window size for windowed mode, WIDTHxHEIGHT. The picture is scaled to the
# window whatever the internal resolution is.
RSX_WINDOW = 1280x720

# Wait for the display's refresh (1) or not (0). The frame rate is set by
# DOD3_FPS below, so 0 only matters above the display's refresh, where it
# lets the frames through at the cost of tearing.
RSX_VSYNC = 1

# Frame rate: a number locks it there (30, 60, 120, 240, ...); uncapped
# removes the cap. Unset, the game keeps its own 30 fps scheme. 60 and 120
# are tested; above 120 the game's physics misbehave (jumps get lower,
# dragon lock-on fails). Above your display's refresh, set RSX_VSYNC = 0.
# adaptive is a cap that follows the scene: the highest of 120, 110, 100,
# 90, 80, 72, 66, 60 ... 30 that the frames keep up with. With no cap the
# frames come out as they are made, some in 5 ms and some in 20, and the
# camera judders for it at any frame rate; with a cap they are shown at
# even intervals.
# Remove the # to set it.
#DOD3_FPS = 60

# Anisotropic filtering for the game's textures: 1 (the original trilinear),
# 2, 4, 8 or 16. Sharper ground and walls at a glancing angle; 16 costs
# nothing measurable on an RTX 4090.
RSX_ANISO = 16

# Anti-aliasing:
#   fxaa                 smooths jagged edges on the finished frame (also
#                        softens the picture slightly); nearly free
#   msaa2, msaa4, msaa8  multisampled 3D scene; costly at 4K on an RTX 4090
#                        (about 78 / 73 / 48 fps uncapped in battle, against
#                        145 without)
# Unset is off. Supersampling is the other way: a Resolution above the
# display's, which is averaged down to the window properly.
#RSX_AA = fxaa

# Field of view: degrees added to the gameplay camera's 65 (horizontal), as
# a zoom so the game's own zooms keep their proportion. 5 to 30; cutscenes
# keep their framing. Unset is the original.
#DOD3_FOV = 15

# Aspect ratio: your screen's shape -- 16:10, 21:9, 32:9, a ratio such as
# 2.39, or auto (the window's, or the screen's at full screen); Settings >
# Advanced Graphics. Wider than 16:9 shows more at the sides in play and in
# cutscenes, the view as tall as before; 16:10 shows more above and below.
# The HUD keeps its 16:9 layout, as big as fits in the middle of the view;
# the title, menus and movies are 16:9 in the middle of the screen. A screen
# of another shape than the one set shows it with bars: a 16:9 screen set to
# 21:9 shows what a 21:9 one would, with bars above and below. A wider view
# is drawn 1280 game pixels wide, so it has fewer lines (540 at 21:9, 360 at
# 32:9, times the Resolution): raise the Resolution to keep it sharp. Unset
# is the original 16:9.
#DOD3_ASPECT = auto

# The engine's own switches (Settings > Advanced Graphics). Shadow quality
# takes effect at the next start.
#   DOD3_SHADOWS      high or ultra: sharper shadows (ultra costs a few
#                     percent); unset is the original
#   DOD3_MOTION_BLUR  0 turns motion blur off
#   DOD3_POSTFX       0 turns off depth of field, bloom and colour grading
#   DOD3_DOF          0 turns off only the depth of field (the blur of
#                     what is near and far); the bloom stays
#   DOD3_DRAW_DISTANCE  2, 3, 5 or 10: the props, bushes and small trees
#                     of the open areas are drawn from that many times as
#                     far away; unset is the original
#   DOD3_TREE_LOD     2, 3, 5 or 10: the large trees are drawn from that
#                     many times as far away, and stay their full models
#                     that many times as far before they turn into flat
#                     pictures of themselves; unset is the original. It
#                     takes effect in the next area the game loads.
# Parts of a level that the game has not loaded yet still appear as it
# loads them, whatever these two say.
#DOD3_SHADOWS = high
#DOD3_MOTION_BLUR = 0
#DOD3_POSTFX = 0
#DOD3_DOF = 0
#DOD3_DRAW_DISTANCE = 3
#DOD3_TREE_LOD = 3

# Blood over the screen in combat (Settings > System > Blood on Screen):
# border leaves out the splashes and keeps the blood around the edges
# while your health is low, a warning; 0 leaves out both. Unset is the
# original.
#DOD3_SCREEN_BLOOD = border

# Post-processing quality (Settings > Picture Settings): high draws the
# depth of field and bloom smoothly above 1280x720, and keeps what is out of
# focus soft instead of showing sharp detail through the blur (the port's
# own version of the game's post-processing shader, in shaders/override).
# At 1280x720 the picture is the original's. Unset is the original. Takes
# effect at the next start.
#DOD3_POSTFX_QUALITY = high

# HDR (Settings > Picture Settings; Windows, Direct3D 12 or Vulkan): 1
# shows the game in HDR on a display that has HDR on in Windows (Settings >
# Display > Use HDR); elsewhere it stays SDR. The picture is shown at
# RSX_HDR_WHITE's brightness, in nits, with its shadows as an SDR display
# shows them (Windows' own conversion of an SDR window washes them out),
# and the light the game clips at white -- the sky, fire, glints -- brighter
# than white, up to the display's peak; the HUD and menus stay at
# RSX_HDR_WHITE. Unset RSX_HDR_WHITE follows Windows' SDR content brightness
# slider. Both take effect at once, but the brighter highlights need HDR on
# when the game starts. RSX_HDR_HIGHLIGHTS = 0 leaves them out.
#RSX_HDR = 1
#RSX_HDR_WHITE = 200

# Renderer, Windows only: d3d12 (Direct3D 12, the default) or vulkan
# (experimental). Takes effect at the next start.
#RSX_BACKEND = vulkan

# Skip the company, middleware and Unreal Engine logos and the opening movie
# at start-up: straight to "Press START". 0 keeps them. Takes effect at the
# next start.
DOD3_SKIP_INTRO = 1

# The launcher: dod3.exe opens it at every start, before the game -- Play,
# the mods, the DLC and these settings. 0 starts the game straight away;
# holding Shift while it starts (Option on a Mac) opens the launcher anyway.
#DOD3_LAUNCHER = 0

# Windows: the launcher asks GitHub for a newer release each time it opens
# and offers it (Update to ..., at the bottom). 0 stops it asking.
#DOD3_UPDATE_CHECK = 0

# While the game's window is in the background (another window in front, or
# minimised): unset keeps running; mute plays the audio as silence; pause
# stops the game -- its music, movies and timers too -- until the window is
# back in front.
#DOD3_UNFOCUSED = pause

# Branch D's final mission: its song presses every note for you, on its
# time (the RPCS3 patch "Auto Play Song of The D Branch Final Mission", by
# bucanero). 1 turns it on; unset is off. Takes effect at the next start.
#DOD3_SONG_AUTOPLAY = 1

# Trophies: a pop-up at the top right of the game as you earn one (Windows,
# Direct3D 12 for now). 0 leaves the pop-ups out; the trophies are kept
# either way (gamedata/trophies) and listed on the launcher's Trophies page.
#DOD3_TROPHY_POPUPS = 0

# Cheats (the launcher's Cheats tab), from a code list for the PS3 game.
# 1 turns one on; unset is off. Each takes effect at the next start.
#   DOD3_CHEAT_HEALTH   your health stays full (Zero's, or the dragon's);
#                       enemies are hurt as usual
#   DOD3_CHEAT_INTONER  the Intoner gauge fills at the first blood and stays
#                       full, in Intoner mode too
#   DOD3_CHEAT_ITEMS    items are not used up
#   DOD3_CHEAT_TIME     a mission's time limit does not count down
#DOD3_CHEAT_HEALTH = 1
#DOD3_CHEAT_INTONER = 1
#DOD3_CHEAT_ITEMS = 1
#DOD3_CHEAT_TIME = 1

# The buttons the game shows in its text, menus and HUD. Unset follows the
# controller you hold (the keyboard's keys when none is plugged in); or one
# of ps3 (the game's own DualShock 3 art), ps4, ps5, xbox, switch, keyboard.
#DOD3_PROMPTS = xbox

# Keyboard and mouse. The mouse turns the camera, with the cursor
# hidden while the game is in front: DOD3_MOUSE = 0 turns that off.
# DOD3_MOUSE_SENS is how far it turns: 1 is the default, 2 twice as far
# (Settings > System Settings > Mouse Sensitivity).
#DOD3_MOUSE = 0
#DOD3_MOUSE_SENS = 1

# The keys, by the pad button each one presses (the game's own Controller
# Settings page says what the buttons do). Each takes a list of keys, or
# none. These are the defaults:
#KEY_MOVE_UP = W
#KEY_MOVE_DOWN = S
#KEY_MOVE_LEFT = A
#KEY_MOVE_RIGHT = D
#KEY_CROSS = Space
#KEY_CIRCLE = E Backspace
#KEY_SQUARE = Mouse1
#KEY_TRIANGLE = Mouse2
#KEY_L1 = Q Mouse3
#KEY_R1 = Shift
#KEY_L2 = R
#KEY_R2 = F
#KEY_L3 = V C
#KEY_R3 = V X
#KEY_START = Esc Enter
#KEY_SELECT = Tab
#KEY_UP = Up 1
#KEY_RIGHT = Right 2
#KEY_DOWN = Down 3
#KEY_LEFT = Left 4
#KEY_LOOK_UP = none
#KEY_LOOK_DOWN = none
#KEY_LOOK_LEFT = WheelUp
#KEY_LOOK_RIGHT = WheelDown
# Keys: A-Z, 0-9, F1-F12, Space, Enter, Tab, Esc, Backspace, Shift, Ctrl,
# Alt, LShift, RShift, LCtrl, RCtrl, LAlt, RAlt, Up, Down, Left, Right,
# Insert, Delete, Home, End, PageUp, PageDown, CapsLock, Minus, Equals,
# LBracket, RBracket, Semicolon, Quote, Comma, Period, Slash, Backslash,
# Grave, Num0-Num9, Mouse1 (left), Mouse2 (right), Mouse3 (middle), Mouse4,
# Mouse5, WheelUp, WheelDown. The prompts on screen show the first key of
# each list. On a Mac a key is its place on the keyboard, Alt is Option,
# and CapsLock cannot be used.

# The camera stick. The game turns the camera by an amount that shrinks
# with the frame time, so at 120 frames a second the stick turned it at a
# quarter of the console's speed; the port keeps it at the console's.
# original puts the game's own behaviour back.
#DOD3_CAMERA_SPEED = original
