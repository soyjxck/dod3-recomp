# Drakengard 3 (dod3-recomp) -- settings. One KEY = VALUE per line; lines
# starting with # are comments. The same names work as environment
# variables, and a variable set in the environment overrides this file.
# The file is read from the folder that holds dod3.exe, or the current one.

# Internal rendering resolution, as a multiple of the game's own 1280x720:
#   1 = 1280x720 (original)   1.5 = 1920x1080   2 = 2560x1440   3 = 3840x2160
# Anything from 0.5 to 8 works. Cost on an RTX 4090: 3 is a few fps.
RSX_SCALE = 1

# Display mode: windowed (a bordered window of RSX_WINDOW size), borderless
# (a window covering the display; the mode to use), or fullscreen
# (exclusive, at the display's current resolution).
RSX_DISPLAY = windowed

# Window size for windowed mode, WIDTHxHEIGHT. The picture is scaled to the
# window whatever the internal resolution is.
RSX_WINDOW = 1280x720

# Wait for the display's refresh (1) or not (0). Off gives no extra frames
# here; the game's own frame cap below is what sets the rate.
RSX_VSYNC = 1

# Frame rate: a number locks it there (30, 60, 120, 240, ...); uncapped
# removes the cap. Unset, the game keeps its own 30 fps scheme. 60 and 120
# are tested; above 120 the game's physics misbehave (jumps get lower,
# dragon lock-on fails). Above your display's refresh, set RSX_VSYNC = 0.
# Remove the # to set it.
#DOD3_FPS = 60
