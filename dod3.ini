# Drakengard 3 (dod3-recomp) -- settings. One KEY = VALUE per line; lines
# starting with # are comments. The same names work as environment
# variables, and a variable set in the environment overrides this file.
# The file is read from the folder that holds the game executable (dod3.exe
# on Windows, dod3 on macOS), or the current one. Both platforms read every
# setting below.

# Internal rendering resolution, as a multiple of the game's own 1280x720:
#   1 = 1280x720 (original)   1.5 = 1920x1080   2 = 2560x1440   3 = 3840x2160
# Anything from 0.5 to 8 works. Cost on an RTX 4090: 3 is a few fps; on an
# M1 Pro, 1.5 holds 60 fps in battle.
RSX_SCALE = 1

# Display mode: windowed (a bordered window of RSX_WINDOW size), borderless
# (a window covering the display; the mode to use), or fullscreen
# (exclusive, at the display's current resolution).
RSX_DISPLAY = windowed

# Window size for windowed mode, WIDTHxHEIGHT. The picture is scaled to the
# window whatever the internal resolution is.
RSX_WINDOW = 1280x720

# Wait for the display's refresh (1) or not (0). Off gives no extra frames
# here; the game's own frame cap below is what sets the rate.
RSX_VSYNC = 1

# Frame rate: a number locks it there (30, 60, 120, 240, ...); uncapped
# removes the cap. Unset, the game keeps its own 30 fps scheme. 60 and 120
# are tested; above 120 the game's physics misbehave (jumps get lower,
# dragon lock-on fails). Above your display's refresh, set RSX_VSYNC = 0.
# Remove the # to set it.
#DOD3_FPS = 60

# Anisotropic filtering for the game's textures: 1 (the original trilinear),
# 2, 4, 8 or 16. Sharper ground and walls at a glancing angle; 16 costs
# nothing measurable on an RTX 4090. Direct3D 12 and Vulkan; the macOS
# renderer does not read it yet.
RSX_ANISO = 16

# Anti-aliasing (Direct3D 12, Vulkan and Metal):
#   fxaa                 smooths jagged edges on the finished frame (also
#                        softens the picture slightly); nearly free
#   msaa2, msaa4, msaa8  multisampled 3D scene; costly at 4K on an RTX 4090
#                        (about 78 / 73 / 48 fps uncapped in battle, against
#                        145 without)
# Unset is off. Supersampling is the other way: a Resolution above the
# display's, which is averaged down to the window properly.
#RSX_AA = fxaa

# Field of view: degrees added to the gameplay camera's 65 (horizontal), as
# a zoom so the game's own zooms keep their proportion. 5 to 30; cutscenes
# keep their framing. Unset is the original.
#DOD3_FOV = 15

# The engine's own switches (Settings > Advanced Graphics):
#   DOD3_SHADOWS      high or ultra: sharper shadows (next start; ultra costs
#                     a few percent); unset is the original
#   DOD3_MOTION_BLUR  0 turns motion blur off
#   DOD3_POSTFX       0 turns off depth of field, bloom and colour grading
#DOD3_SHADOWS = high

# Skip the company, middleware and Unreal Engine logos and the opening movie
# at start-up: straight to "Press START". 0 keeps them.
DOD3_SKIP_INTRO = 1

# While the game's window is in the background (another window in front, or
# minimised): unset keeps running; mute plays the audio as silence; pause
# stops the game -- its music, movies and timers too -- until the window is
# back in front.
#DOD3_UNFOCUSED = pause

# The Graphics Settings and System Settings pages in the game's own Settings
# menu edit this file: resolution, display mode, frame rate, v-sync,
# anti-aliasing, texture filtering and field of view; skip intro, the
# background behaviour and renderer. All but the renderer and skip intro
# apply at once; those two the next time the game starts.
